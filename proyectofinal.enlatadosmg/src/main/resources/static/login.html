<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlatados MG - Iniciar Sesión</title>
    <!-- Estilos de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos propios del proyecto -->
    <link href="/css/estilos.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center">

    <div class="container animate-fade-in" style="max-width: 450px;">
        <div class="glass-panel p-4 p-md-5 text-center">

            <div class="mb-4">
                <h2 class="fw-bold text-white">
                    Enlatados MG
                </h2>
                <p class="text-secondary small">Gestión de Logística y Almacén</p>
            </div>

            <form id="login-form">
                <div class="mb-3 text-start">
                    <label for="usuario-id" class="form-label text-secondary small">ID de Usuario</label>
                    <input type="number" class="form-control" id="usuario-id" required placeholder="Ej. 1">
                </div>

                <div class="mb-4 text-start">
                    <label for="contrasena" class="form-label text-secondary small">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Ingresar
                </button>
            </form>

            <div class="border-top border-secondary pt-3 mt-3 opacity-50">
                <small class="text-secondary">Proyecto de Alfredo García - Progra III</small>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts de la aplicación -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('usuario-id').value);
            const contrasena = document.getElementById('contrasena').value;

            try {
                const res = await api.post('/auth/login', { id, contrasena });
                if (res && res.id) {
                    sessionStorage.setItem('usuarioId', res.id);
                    showToast('¡Inicio de sesión exitoso! Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                }
            } catch (err) {
                // El toast de error lo maneja automáticamente api.js
            }
        });
    </script>
</body>

</html>
